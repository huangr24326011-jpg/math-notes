# ==========================================
# 一、项目基本设置
# ==========================================

project:
  # 指定项目类型为网站
  # Quarto 会将 .qmd 文件转换为 HTML 网页
  type: website

  # 指定需要额外复制到网站输出目录的资源文件
  resources:
    - "pdfs/**"  # 包含 pdfs 文件夹及其子文件夹中的所有文件
                  # 方便读者在网站上查看或下载 PDF 讲义


# ==========================================
# 二、网站整体结构
# ==========================================

website:

  # 网站名称
  # 通常显示在网站顶部导航栏
  title: "Mathematical Notes"

  # ----------------------------------------
  # 2.1 顶部导航栏（Navbar）
  # ----------------------------------------

  navbar:
    left:  # 导航链接放在顶部导航栏左侧

      - href: index.qmd  # 点击后跳转到主页
        text: 首页        # 导航栏显示的文字

      - href: about.qmd  # 点击后跳转到关于页面
        text: 关于

  # ----------------------------------------
  # 2.2 左侧边栏（Sidebar）
  # ----------------------------------------

  sidebar:

    # docked 表示侧边栏采用停靠式布局
    # 在空间充足的屏幕上通常显示在页面左侧
    style: docked

    # contents 用来定义侧边栏的目录结构
    # 可以包含单个页面，也可以包含章节分组
    contents:

      # 主页也出现在侧边栏
      - index.qmd

      # 第一个数学专题分类
      - section: "数学分析"

        # 这个分类下包含哪些页面
        contents:
          - notes/compactness.qmd
          # 对应 notes 文件夹中的 compactness.qmd
          # 可以在这里继续添加其他数学分析讲义

      # 第二个数学专题分类
      - section: "代数与几何"

        # [] 表示目前没有添加任何页面
        # 以后可以在这里添加线性代数、抽象代数、几何等笔记
        contents: []

  # 开启网站搜索功能
  # 读者可以通过搜索框查找讲义中的内容
  search: true


# ==========================================
# 三、网页输出格式
# ==========================================

format:

  # 指定输出格式为 HTML
  html:

    # 设置网站的视觉主题
    # cosmo 是 Bootswatch 提供的一种简洁主题
    theme: cosmo

    # 显示当前页面的文章目录
    # 根据 Markdown 标题自动生成目录
    toc: true

    # 自动为文章中的章节标题添加编号
    # 例如：
    # 1 紧致性
    # 1.1 紧致性的定义
    # 1.2 Heine-Borel 定理
    # 2 极值定理
    number-sections: true